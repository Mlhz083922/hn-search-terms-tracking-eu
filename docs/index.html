<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HN Search Terms Tracking EU · 女装泳装热搜词追踪（DE）</title>
  <link rel="stylesheet" href="styles.css?v=85921e8d7d">
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <form id="auth-form" class="auth-box">
      <div class="auth-logo">德</div>
      <h1>HN Search Terms Tracking EU</h1>
      <p>输入访问密码查看数据 · 24 小时内免重复验证</p>
      <input id="auth-pass" type="password" placeholder="访问密码" autocomplete="current-password">
      <button class="btn primary" type="submit">进入</button>
      <p id="auth-error" class="auth-error" hidden>密码错误，请重试</p>
    </form>
  </div>
  <div id="load-status" class="load-status" hidden></div>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">德</div>
        <div>
          <h1>女装泳装热搜词追踪 · DE</h1>
          <div class="site-line">
            <p id="site-label">亚马逊德国站 · HN Search Terms Tracking EU · 只读快照</p>
          </div>
          <p class="site-desc">ABA 排名与搜索量趋势、关键词库维护、西柚洞察匹配</p>
        </div>
      </div>
      <div class="topbar-right">
        <label class="week-picker">
          <span>数据周</span>
          <select id="year-select"></select>
          <select id="week-select"></select>
        </label>
        <button id="btn-refresh" class="btn ghost" title="刷新数据">
          <i data-lucide="refresh-cw"></i><span>刷新</span>
        </button>
        <button id="btn-export" class="btn ghost" title="导出关键词库 CSV">
          <i data-lucide="download"></i><span>导出CSV</span>
        </button>
      </div>
    </header>

    <div id="team-update-progress" class="team-update-progress" hidden>
      <div class="hstack">
        <span id="team-update-label">准备更新...</span>
        <span id="team-update-pct">0%</span>
      </div>
      <div class="progress"><i id="team-update-bar" style="width:0%"></i></div>
    </div>

    <nav class="tabs" aria-label="主导航">
      <button class="tab active" data-view="overview"><i data-lucide="layout-dashboard"></i>总览</button>
      <button class="tab" data-view="library"><i data-lucide="database"></i>关键词库</button>
      <button class="tab" data-view="update"><i data-lucide="upload-cloud"></i>周度更新</button>
      <button class="tab" data-view="xiyou"><i data-lucide="refresh-cw"></i>西柚匹配</button>
    </nav>

    <main id="view-root"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="vendor/lucide.min.js?v=85921e8d7d"></script>
  <script src="app.js?v=85921e8d7d"></script>

<script>
(function () {
  var BUILD = "85921e8d7d";
  var lastCheck = 0;
  function check() {
    var now = Date.now();
    if (now - lastCheck < 60000) return;
    lastCheck = now;
    fetch("./version.json?ts=" + now, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) {
        if (!v || !v.version || v.version === BUILD) return;
        var key = "hnVerRetry:" + v.version;
        if (sessionStorage.getItem(key)) {
          var el = document.getElementById("load-status");
          if (el) { el.hidden = false; el.textContent = "已发布新版本（" + v.version + "），请按 Cmd+Shift+R 强制刷新"; }
          return;
        }
        sessionStorage.setItem(key, "1");
        location.replace(location.pathname + "?v=" + v.version + location.hash);
      })
      .catch(function () {});
  }
  try {
    check();
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") check();
    });
  } catch (e) {}
})();
</script>
</body>
</html>
